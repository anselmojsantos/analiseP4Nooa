<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Diagnóstico de animação</title>
		<style>
			body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 24px; }
			h1 { font-size: 20px; }
			.box { padding: 16px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
			.on { background: #fee; border: 2px solid #c00; color: #900; }
			.off { background: #efe; border: 2px solid #0a0; color: #060; }
			code { background: #eee; padding: 2px 5px; border-radius: 3px; }
		</style>
	</head>
	<body>
		<h1>Diagnóstico de animação</h1>
		<div id="r"></div>
		<script>
			var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
			document.getElementById('r').innerHTML =
				'<div class="box ' + (reduce ? 'on' : 'off') + '">' +
				'prefers-reduced-motion: <strong>' + (reduce ? 'REDUCE (movimento DESLIGADO)' : 'NO-PREFERENCE (movimento LIGADO)') + '</strong>' +
				'</div>' +
				(reduce
					? '<p>Seu navegador esta com <strong>movimento desligado</strong>. Por isso a gaveta aparecia instantaneamente (snap) e vc achou que nao animava.<br><br>Para reativar no Edge: <code>edge://settings/accessibility</code> e ligue <em>Animate</em>.<br>No Windows: Configurações &rsaquo; Acessibilidade &rsaquo; Efeitos visuais &rsaquo; <strong>Animações</strong>.</p>'
					: '<p>Movimento esta <strong>ligado</strong>. Se a gaveta ainda parecer seca, o problema e a curva/duracao da animacao, nao o sistema.</p>') +
				'<p style="color:#666;font-size:14px">Largura desta janela: ' + innerWidth + 'px (a gaveta so existe abaixo de 768px)</p>';
		</script>
	</body>
</html>
